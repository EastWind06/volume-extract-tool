name: 发布 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 规范附件名并清理旧附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "分卷解压工具.exe" "volume-extract-tool-${GITHUB_REF_NAME}.exe"
          python3 - <<'PY'
          import os, json, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          try:
              data = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=headers)))
              for asset in data.get("assets", []):
                  req = urllib.request.Request(asset["url"], headers=headers, method="DELETE")
                  urllib.request.urlopen(req)
                  print("已删除旧附件:", asset["name"])
          except Exception as exc:
              print("清理旧附件跳过:", exc)
          PY

      - name: 创建发行版并上传 exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: 'volume-extract-tool-${{ github.ref_name }}.exe'
          draft: false
          prerelease: false
          body: |
            ## 分卷压缩包分批解压工具 ${{ github.ref_name }}

            单文件 exe（约 11.4 MB），内置官方 UnRAR.exe，无需安装 Python，双击即可运行。

            ### 主要功能
            - 按顺序解压 RAR / ZIP 分卷，确认数据写入后回收已处理分卷，避免双倍磁盘占用
            - 预校验全部分卷、自动删除二次确认、停止按钮、进度条、审计日志
            - **资源管理器右键菜单**：`--install-menu` 安装后，右键压缩包/文件夹即可用本工具打开，无需预先启动软件
            - 界面底部说明含署名 by东风敬我桂花酒

            ### 使用提示
            下载后直接运行 exe。如需演练自动删除，请先把测试分卷复制到别处再操作。
            右键菜单安装/卸载：命令行执行 `exe --install-menu` / `exe --uninstall-menu`。
